name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check plugin entry
        run: node --check lib/index.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check import script
        run: python -m py_compile scripts/import_hao.py

      - name: Check shell scripts
        if: runner.os != 'Windows'
        run: bash -n scripts/run-import.sh install.sh

      - name: Check PowerShell runner syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path scripts/run-import.ps1).Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Check package manifest
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) process.exit(1); console.log(p.name, p.version)"

      - name: Run tests
        run: node --test

      - name: Windows PowerShell smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'hao-smoke'
          $data = Join-Path $root 'appdata/Hao Wallpaper'
          $engine = Join-Path $root 'engine'
          New-Item -ItemType Directory -Force -Path $data, $engine | Out-Null
          $png = Join-Path $root 'pic.png'
          [System.IO.File]::WriteAllText($png, 'png-bytes', (New-Object System.Text.UTF8Encoding $false))
          $meta = @{
            staticWallpapers = @{ a = @{ id = '1'; title = 'Win-壁纸-标题'; localPath = $png } }
            dynamicWallpapers = @{}
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $data 'wallpaper-data.json'), $meta,
            (New-Object System.Text.UTF8Encoding $false)
          )
          $env:HAO_WALLPAPER_DATA_DIR = $data
          $env:HAO_WALLPAPER_DIR = (Join-Path $root 'no-such-lib')
          $env:DSH_WALLPAPER_ENGINE_DIR = $engine
          & .\scripts\run-import.ps1 --force
          $log = Get-Content -Raw (Join-Path $engine 'import.log')
          if ($log -notmatch 'rc=0' -or $log -notmatch 'up-hao-01\.png') { throw "unexpected log: $log" }
          if (-not (Test-Path (Join-Path $engine 'uploads/up-hao-01.png'))) { throw 'missing imported file' }

      - name: Windows PowerShell 5.1 smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'hao-smoke-legacy'
          $data = Join-Path $root 'appdata/Hao Wallpaper'
          $engine = Join-Path $root 'engine'
          New-Item -ItemType Directory -Force -Path $data, $engine | Out-Null
          $png = Join-Path $root 'pic.png'
          [System.IO.File]::WriteAllText($png, 'png-bytes', (New-Object System.Text.UTF8Encoding $false))
          $meta = @{
            staticWallpapers = @{ a = @{ id = '1'; title = 'Win-壁纸-旧版'; localPath = $png } }
            dynamicWallpapers = @{}
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $data 'wallpaper-data.json'), $meta,
            (New-Object System.Text.UTF8Encoding $false)
          )
          $env:HAO_WALLPAPER_DATA_DIR = $data
          $env:HAO_WALLPAPER_DIR = (Join-Path $root 'no-such-lib')
          $env:DSH_WALLPAPER_ENGINE_DIR = $engine
          & .\scripts\run-import.ps1 -Force
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 runner exited $LASTEXITCODE" }
          $log = Get-Content -Raw -Encoding UTF8 (Join-Path $engine 'import.log')
          if ($log -notmatch 'rc=0' -or $log -notmatch 'up-hao-01\.png') { throw "unexpected log: $log" }
          if (-not (Test-Path (Join-Path $engine 'uploads/up-hao-01.png'))) { throw 'missing imported file' }

      - name: Windows PowerShell early failure is logged
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'hao-broken'
          $engine = Join-Path $root 'engine'
          New-Item -ItemType Directory -Force -Path $root, $engine | Out-Null
          Copy-Item scripts/run-import.ps1 (Join-Path $root 'run-import.ps1')
          $env:DSH_WALLPAPER_ENGINE_DIR = $engine
          # 脚本内部 exit 127 会终止整个调用它的 PowerShell 会话，
          # 必须放到子进程里跑才能检查退出码。
          $runner = Join-Path $root 'run-import.ps1'
          $proc = Start-Process -FilePath 'powershell.exe' `
            -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $runner) `
            -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 127) { throw "expected 127, got $($proc.ExitCode)" }
          $log = Get-Content -Raw -Encoding UTF8 (Join-Path $engine 'import.log')
          if ($log -notmatch 'import_hao.py') { throw "missing-script error not logged: $log" }

      - name: Verify scripts ship in the tarball
        if: runner.os == 'Linux'
        run: |
          npm pack --silent >/dev/null
          TARBALL=$(ls dsh-hao-import-*.tgz)
          tar -tzf "$TARBALL" | grep -qx 'package/scripts/run-import.sh'
          tar -tzf "$TARBALL" | grep -qx 'package/scripts/run-import.ps1'
          tar -tzf "$TARBALL" | grep -qx 'package/scripts/import_hao.py'
